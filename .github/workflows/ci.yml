name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit test
        run: ./gradlew assembleDebug testDebugUnitTest

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  firestore-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: functions
      - run: npm ci
        working-directory: rules-test
      - name: Security rules tests
        run: npm test
        working-directory: rules-test
      - name: Cloud Functions integration tests
        working-directory: functions
        run: npx tsc && ../rules-test/node_modules/.bin/firebase emulators:exec --only firestore --project demo-pashe --config ../firebase.json "node --test lib/test/integration.test.js"
